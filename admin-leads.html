<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="View lead submissions captured by The Trance demo booking flow.">
  <title>Admin Leads | The Trance</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" href="IMG_3385.PNG">
  <link rel="stylesheet" href="theme.css">
  <script defer src="site.js"></script>
</head>
<body>
  <header class="site-header">
    <nav class="navbar container-wide">
      <a class="brand-link" href="trance.html" aria-label="Go to home">
        <div class="brand-mark">
          <img src="IMG_3385.PNG" alt="The Trance logo" class="brand-logo">
        </div>
      </a>
      <button class="mobile-toggle" type="button" aria-expanded="false" aria-controls="navPanel">Menu</button>
      <div class="nav-panel" id="navPanel">
        <ul class="nav-links">
          <li><a href="trance.html">Site</a></li>
          <li><a href="admin.html">Overview</a></li>
          <li><a href="admin-leads.html">Leads</a></li>
          <li><a href="admin-analytics.html">Analytics</a></li>
          <li><a href="admin-roster.html">Roster</a></li>
        </ul>
        <div class="nav-actions">
          <a class="mini-link" href="booking.html">New booking</a>
          <button class="chat-btn" type="button" data-chat-trigger>WhatsApp</button>
        </div>
      </div>
    </nav>
  </header>

  <main class="page-main">
    <section class="page-hero" style="--hero-image:url('https://images.unsplash.com/photo-1516321318423-f06f85e504b3?auto=format&fit=crop&q=80&w=1800');">
      <div class="container">
        <span class="pill-label">Admin leads</span>
        <h1>See inquiry quality, budget range, and next-fit request signals.</h1>
      </div>
    </section>

    <section class="page-section">
      <div class="container" data-admin-guard>
        <div class="admin-lock surface-card">
          <span class="pill-label">Restricted</span>
          <h2>Unlock the admin pages.</h2>
          <p>Use the same local access code to open this demo workspace.</p>
          <form id="adminUnlockForm" class="wizard-grid">
            <input id="adminCode" type="password" placeholder="Access code" autocomplete="off">
            <button class="btn primary-btn" type="submit">Unlock</button>
          </form>
          <p id="adminStatus" class="helper-note"></p>
        </div>
      </div>

      <div class="container" data-admin-shell hidden>
        <div class="admin-tabs">
          <a class="tab-link" href="admin.html">Overview</a>
          <a class="tab-link" href="admin-leads.html">Leads</a>
          <a class="tab-link" href="admin-analytics.html">Analytics</a>
          <a class="tab-link" href="admin-roster.html">Roster</a>
        </div>
        <div class="admin-actions" style="margin:22px 0">
          <button class="btn primary-btn" type="button" data-admin-action="seed">Load demo data</button>
          <button class="btn ghost-btn" type="button" data-admin-action="export-leads">Export leads</button>
          <button class="btn ghost-btn" type="button" data-admin-action="clear-leads">Clear leads</button>
        </div>
        <div id="leadTable"></div>
      </div>
    </section>
  </main>
</body>
</html>
